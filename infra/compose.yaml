services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: alon_ai
      POSTGRES_USER: alon_ai
      POSTGRES_PASSWORD: alon_ai
    ports:
      - "127.0.0.1:${ALON_AI_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alon_ai -d alon_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: ../backend
    environment:
      ALON_AI_DATABASE_URL: postgresql+psycopg://alon_ai:alon_ai@postgres:5432/alon_ai
      ALON_AI_ENVIRONMENT: ${ALON_AI_ENVIRONMENT:-development}
      ALON_AI_OUTREACH_ENABLED: "false"
      ALON_AI_PROVIDER_MODE: ${ALON_AI_PROVIDER_MODE:-disabled}
      ALON_AI_L07_LIVE_CONFIG_PATH: /app/.local/live/live-idea.json
      ALON_AI_L07_SECRET_ROOT: /app/.local/live/secrets
      ALON_AI_L07_SECRET_KEY_FILE: /app/.local/live/live-secret.key
      ALON_AI_L07_SECRET_KEY_VERSION: v1
      ALON_AI_OPERATOR_AUTH_SUBJECT: local-operator@alon.ai
      ALON_AI_OPERATOR_PASSWORD_HASH: ${ALON_AI_OPERATOR_PASSWORD_HASH:-}
      ALON_AI_SESSION_SIGNING_KEY: ${ALON_AI_SESSION_SIGNING_KEY:-}
      ALON_AI_FRONTEND_ORIGIN: http://localhost:${ALON_AI_FRONTEND_PORT:-3000}
    command: ["uvicorn", "alon_ai.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:${ALON_AI_API_PORT:-8000}:8000"
    volumes:
      - local_live_private:/app/.local:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
    environment:
      ALON_AI_DATABASE_URL: postgresql+psycopg://alon_ai:alon_ai@postgres:5432/alon_ai
      ALON_AI_DBOS_SYSTEM_DATABASE_URL: postgresql://alon_ai:alon_ai@postgres:5432/alon_ai
      ALON_AI_ENVIRONMENT: ${ALON_AI_ENVIRONMENT:-development}
      ALON_AI_OUTREACH_ENABLED: "false"
      ALON_AI_PROVIDER_MODE: disabled
    command: ["python", "-m", "alon_ai.worker.main"]
    depends_on:
      postgres:
        condition: service_healthy

  live-provision:
    build:
      context: ../backend
    stdin_open: true
    tty: true
    environment:
      ALON_AI_DATABASE_URL: postgresql+psycopg://alon_ai:alon_ai@postgres:5432/alon_ai
      ALON_AI_ENVIRONMENT: ${ALON_AI_ENVIRONMENT:-development}
      ALON_AI_OUTREACH_ENABLED: "false"
      ALON_AI_PROVIDER_MODE: disabled
    volumes:
      - local_live_private:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["live-setup"]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${ALON_AI_API_PORT:-8000}
    environment:
      API_BASE_URL: http://api:8000
      ALON_AI_FRONTEND_ORIGIN: http://localhost:${ALON_AI_FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:${ALON_AI_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  local_live_private:

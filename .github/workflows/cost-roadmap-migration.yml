name: Cost roadmap migration

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - scripts/migrate_cost_optimized_roadmap.py
      - .github/workflows/cost-roadmap-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Apply one-time migration
        run: python3 scripts/migrate_cost_optimized_roadmap.py
      - name: Regenerate roadmap artifacts
        run: python3 scripts/validate_roadmap.py --write
      - name: Validate regenerated roadmap
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          version: '0.11.26'
      - name: Run focused roadmap validator tests
        working-directory: backend
        run: |
          uv sync --locked --all-extras --dev
          uv run pytest tests/unit/test_roadmap_validator.py -q
      - name: Remove temporary migration tooling
        run: |
          rm -f scripts/migrate_cost_optimized_roadmap.py
          rm -f .github/workflows/cost-roadmap-migration.yml
          rm -f .github/workflows/cost-roadmap-regenerate.yml
      - name: Commit migrated roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "docs: regenerate cost-optimized roadmap graph"
          git push origin HEAD:cost-optimized-roadmap

name: Verify Final Cost-First Roadmap

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/verify-cost-first-roadmap.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Replace stale legacy cohort assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/unit/test_roadmap_validator.py')
          text = p.read_text(encoding='utf-8')
          start_marker = 'def test_active_roadmap_uses_only_staged_thousand_lead_contract() -> None:\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index('\ndef test_staged_lead_source_validator_accepts_exact_authorities', start)
              new = '''def test_active_roadmap_uses_cost_first_contract() -> None:
              repository_root = Path(__file__).resolve().parents[3]
              roadmap_root = repository_root / "docs" / "development-roadmap"
              active_paths = [roadmap_root / "README.md"]
              active_paths.extend(sorted(roadmap_root.glob("[0-9][0-9]-*/*.md")))
              active_text = "\\n".join(path.read_text(encoding="utf-8") for path in active_paths)

              for required in (
                  "SHADOW",
                  "REVIEW_20",
                  "QUALIFIED_50",
                  "SCALE_100_TO_300",
                  "BRAVE_PLACE_SEARCH",
                  "Cloudflare Tunnel",
                  "Cloudflare Access",
                  "R2",
              ):
                  assert required in active_text

              for forbidden in (
                  "100/200/300/400",
                  "100/300/600/1,000",
                  "100/300/600/1000",
              ):
                  assert forbidden not in active_text

          '''
              new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines())
              text = text[:start] + new + text[end:]
          old_fp = '2e061a5b5b83a4a18b5f3de88896a2b32e5e7cdf4870145b17be44dea4a63271'
          new_fp = 'a6d8c772aa75769285732be8293438241d327586f72938fc718c0e314e35a2db'
          if old_fp in text:
              text = text.replace(old_fp, new_fp)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify roadmap artifacts
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Format validator test
        run: uv run ruff format tests/unit/test_roadmap_validator.py
        working-directory: backend
      - name: Lint validator test
        run: uv run ruff check tests/unit/test_roadmap_validator.py
        working-directory: backend
      - name: Run focused roadmap tests
        run: uv run pytest tests/unit/test_roadmap_validator.py -q
        working-directory: backend
      - name: Remove temporary verifier
        run: rm .github/workflows/verify-cost-first-roadmap.yml
      - name: Commit verified final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "test: verify final cost-first roadmap state"
            git push origin HEAD:cost-optimized-roadmap
          fi

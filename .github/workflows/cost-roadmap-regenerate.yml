name: Regenerate Cost-Optimized Roadmap

# regeneration-attempt: 6
on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/cost-roadmap-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Apply cost-first roadmap migration
        run: python3 scripts/migrate_cost_optimized_roadmap.py
      - name: Regenerate executable roadmap
        run: python3 scripts/validate_roadmap.py --write
      - name: Verify generated roadmap is current
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Run roadmap validator tests
        run: uv run pytest tests/unit/test_roadmap_validator.py -q
        working-directory: backend
      - name: Commit migrated sources and generated roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_roadmap.py backend/tests/unit/test_roadmap_validator.py docs/development-roadmap
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "docs: regenerate cost-first roadmap graph [generated-cost-roadmap]"
            git push origin HEAD:cost-optimized-roadmap
          fi
name: Finalize Cost-Optimized Roadmap

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/cost-roadmap-regenerate.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Apply remaining source-only cost-first migration
        run: |
          python3 - <<'PY'
          from scripts.migrate_cost_optimized_roadmap import (
              migrate_secondary_roadmap_docs,
              migrate_security_secret_boundary,
          )
          migrate_secondary_roadmap_docs()
          migrate_security_secret_boundary()
          PY
      - name: Normalize cost-first validator tests
        run: python3 scripts/fix_cost_optimized_roadmap_tests.py
      - name: Regenerate executable roadmap
        run: python3 scripts/validate_roadmap.py --write
      - name: Verify generated roadmap is current
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Run roadmap validator tests
        run: uv run pytest tests/unit/test_roadmap_validator.py -q
        working-directory: backend
      - name: Remove temporary migration tooling
        run: |
          rm -f .github/workflows/cost-roadmap-migration.yml
          rm -f .github/workflows/cost-roadmap-regenerate.yml
          rm -f scripts/migrate_cost_optimized_roadmap.py
          rm -f scripts/fix_cost_optimized_roadmap_tests.py
          rm -f scripts/fix_cost_roadmap_tests.py
          rm -f scripts/patch_cost_optimized_roadmap_tests.py
      - name: Commit finalized roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes to commit"
            exit 0
          fi
          git commit -m "docs: finalize cost-optimized roadmap graph"
          git push origin HEAD:cost-optimized-roadmap

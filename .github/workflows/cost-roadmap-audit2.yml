name: Inventory Legacy Cost Roadmap References

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/cost-roadmap-audit2.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inventory
        run: |
          echo '=== LAUNCH ==='
          grep -RInE '100/200/300/400|100/300/600|600/1,000|600/1000|terminal 1,000|cumulative 1,000|recipient ceiling.*1,000|fifth cohort' docs/development-roadmap || true
          echo '=== INFRA ==='
          grep -RInE 'T7-AWS|AWS witness|Amazon S3|Google Cloud Storage|GCS|sole-AWS|KMS plus Secret Manager|160-GiB|160 GB|Object Lock|multi-cloud.*required|Tailscale' docs/development-roadmap || true
          echo '=== DISCOVERY ==='
          grep -RInE 'Google Maps|Instagram|TikTok|automated social|social scraping' docs/development-roadmap || true

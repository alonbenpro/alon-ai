name: Finalize Cost Roadmap Tests

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/finalize-cost-roadmap-tests.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Finalize roadmap validator expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import re
          import sys

          root = Path.cwd()
          path = root / "backend/tests/unit/test_roadmap_validator.py"
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"def test_active_roadmap_uses_only_staged_thousand_lead_contract\(\) -> None:\n.*?\n\ndef test_staged_lead_source_validator_accepts_exact_authorities",
              re.S,
          )
          replacement = '''def test_active_roadmap_uses_cost_first_contract() -> None:\n    repository_root = Path(__file__).resolve().parents[3]\n    roadmap_root = repository_root / "docs" / "development-roadmap"\n    active_paths = [roadmap_root / "README.md"]\n    active_paths.extend(sorted(roadmap_root.glob("[0-9][0-9]-*/*.md")))\n    active_text = "\\n".join(path.read_text(encoding="utf-8") for path in active_paths)\n\n    for required in (\n        "SHADOW",\n        "REVIEW_20",\n        "QUALIFIED_50",\n        "SCALE_100_TO_300",\n        "BRAVE_PLACE_SEARCH",\n    ):\n        assert required in active_text\n\n    for forbidden in (\n        "100/200/300/400",\n        "100/300/600/1,000",\n        "100/300/600/1000",\n    ):\n        assert forbidden not in active_text\n\n\ndef test_staged_lead_source_validator_accepts_exact_authorities'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one stale active-roadmap test block, found {count}")

          spec = importlib.util.spec_from_file_location("roadmap_validator_final", root / "scripts/validate_roadmap.py")
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load roadmap validator")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          fingerprint = module.graph_fingerprint(module.parse_roadmap(root))

          fixed = re.compile(r'(assert graph_fingerprint\(roadmap\) == \(\n\s+")[0-9a-f]{64}("\n\s+\))')
          if fixed.search(text):
              text = fixed.sub(rf'\g<1>{fingerprint}\g<2>', text, count=1)

          path.write_text(text, encoding="utf-8")
          print(f"final fingerprint: {fingerprint}")
          PY
      - name: Verify roadmap artifacts
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Format finalized roadmap test
        run: uv run ruff format tests/unit/test_roadmap_validator.py
        working-directory: backend
      - name: Check finalized roadmap test
        run: uv run ruff check tests/unit/test_roadmap_validator.py
        working-directory: backend
      - name: Run focused roadmap tests
        run: uv run pytest tests/unit/test_roadmap_validator.py -q
        working-directory: backend
      - name: Commit finalized tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/unit/test_roadmap_validator.py
          if git diff --cached --quiet; then
            echo "No test changes"
          else
            git commit -m "test: finalize cost-first roadmap contract"
            git push origin HEAD:cost-optimized-roadmap
          fi

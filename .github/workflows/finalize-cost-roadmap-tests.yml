name: Finalize Cost Roadmap Tests

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/finalize-cost-roadmap-tests.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Finalize roadmap validator expectations
        run: python3 scripts/finalize_cost_first_roadmap_tests.py
      - name: Verify roadmap artifacts
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Run focused roadmap tests
        run: uv run pytest tests/unit/test_roadmap_validator.py -q
        working-directory: backend
      - name: Commit finalized tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/unit/test_roadmap_validator.py
          if git diff --cached --quiet; then
            echo "No test changes"
          else
            git commit -m "test: finalize cost-first roadmap contract"
            git push origin HEAD:cost-optimized-roadmap
          fi

name: Finalize Cost-First Roadmap Consistency

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/finalize-cost-roadmap-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Rewrite remaining cost-heavy secondary contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Frontend launch semantics.
          replace(
              'docs/development-roadmap/07-frontend/03-experiment-control-center.md',
              'Test evidence: weak evidence, late evidence and terminal 1,000 cases.',
              'Test evidence: weak evidence, late evidence and terminal explicitly authorized 100–300 scale cases.',
          )

          # Discovery authority: Brave-only automation, social/manual evidence only.
          replace(
              'docs/development-roadmap/08-security-and-compliance/04-outreach-compliance.md',
              'Lead discovery uses only reviewed LeadDiscoveryProvider adapters and source-specific scopes, beginning with Google Maps and reviewed public business evidence. Register exact allowed URL/API/query/filter, fields, rate, terms, capture/expiry and onward-use constraints. Public visibility is evidence availability, never consent or authorization. Social/directory sources require their own adapter/terms/evidence tests; no arbitrary crawling or fabricated email/person/role linkage.',
              'Automated v1 lead discovery uses only the reviewed Brave Place Search LeadDiscoveryProvider adapter and its exact source-specific scope. Register the Brave API/query/filter, fields, rate, terms, capture/expiry, cost and onward-use constraints. Public visibility is evidence availability, never consent or authorization. Google Maps, Instagram, TikTok, social networks and directories are not automated discovery targets; social/public profiles may be attached only as manually reviewed evidence with provenance, retention and redaction. No arbitrary crawling or fabricated email/person/role linkage is allowed.',
          )
          replace(
              'docs/development-roadmap/07-frontend/05-lead-and-campaign-management.md',
              'Discovery uses Google Maps and other reviewed public business sources only through approved adapters and exact scopes. The UI exposes source time, query/filter version, provenance, preliminary facts/unknowns, dedupe disposition and review validity. Social/directory sources are unavailable until their own adapter/terms/evidence gate exists; an input URL is not permission to crawl.',
              'Automated discovery uses Brave Place Search only through the approved adapter and exact scope. The UI exposes source time, query/filter version, provenance, preliminary facts/unknowns, dedupe disposition, cost and review validity. Google Maps/social/directory automation is unavailable in v1; social/public profiles appear only as manually reviewed evidence with reviewer/time/provenance. An input URL is never permission to crawl.',
          )
          replace(
              'docs/development-roadmap/03-workflows/04-lead-qualification-workflow.md',
              'Discovery uses Google Maps and reviewed public business sources through approved LeadDiscoveryProvider adapters. Each source records adapter/terms/query/filter version, source time, capture/hash and dedupe keys; no arbitrary social crawling is assumed. A person/owner/role/contact/link cannot be fabricated. Identity conflicts quarantine without auto-merge; unavailable required facts are UNKNOWN.',
              'Automated discovery uses the approved Brave Place Search LeadDiscoveryProvider adapter only. Each Brave observation records adapter/terms/query/filter version, source time, capture/hash, cost and dedupe keys. Google Maps/social/directory automation and arbitrary crawling are outside v1; manually reviewed social/public-page evidence may enter only through the evidence contract. A person/owner/role/contact/link cannot be fabricated. Identity conflicts quarantine without auto-merge; unavailable required facts are UNKNOWN.',
          )

          # Internal-launch M8 baseline: one small VPS, Cloudflare private ingress, encrypted R2.
          p = root / 'docs/development-roadmap/12-launch-and-operations/02-controlled-internal-launch.md'
          text = p.read_text()
          substitutions = {
              '**Status:** Planned M8 private-operations gate; no product stack, VPS, AWS witness, backup, monitoring, operator auth, or internal launch exists today': '**Status:** Planned M8 private-operations gate; no product stack, private VPS, Cloudflare Access/Tunnel ingress, encrypted R2 backup, monitoring, operator auth, or internal launch exists today',
              'encrypted GCS plus selected AWS S3 `eu-central-1` repository/witness acceptance, clean restore': 'application-encrypted Cloudflare R2 repository acceptance, off-host recovery material, clean restore',
              'hot multi-cloud compute, GCS as deletion authority': 'multi-cloud compute/backup as a pre-revenue requirement, provider-side encryption as sole backup protection',
              'AWS S3 is the sole off-Google repo-2/deletion witness and must pass the real, non-emulator `T7-AWS-WITNESS-ACCEPT` matrix in `eu-central-1` before M8.': 'Cloudflare R2 is the sole required pre-revenue off-host repository and must pass the real `T7-R2-RECOVERY-ACCEPT` encrypted backup/restore/account-recovery matrix before M8. No second-cloud witness is an M8 prerequisite.',
              'secret/KMS generations without values, GCS/AWS account-region-bucket-policy/IAM hashes, latest `BackupManifestV1`, sole AWS authority-head exact version/ETag/checksum': 'secret/encryption generations without values, R2 account/bucket/credential-policy/encryption hashes, latest `BackupManifestV1`, off-host recovery-package hash',
              'backup/AWS witness ambiguity': 'backup/R2 recovery ambiguity',
              'Retain existing private access, AWS witness, DR01..DR11, paging, command and no-public-ingress safeguards.': 'Retain Cloudflare Access/Tunnel private ingress, encrypted R2 recovery, DR01..DR11, paging, command and no-public-product-ingress safeguards.',
              'signed release/backup/AWS manifests': 'signed release/backup/R2 manifests',
              'GCS data cannot vote on or reconstruct AWS deletion commitment.': 'No provider-side metadata can substitute for the signed application retention/deletion ledger or successful encrypted R2 restore evidence.',
              '`T7-AWS-WITNESS-ACCEPT`': '`T7-R2-RECOVERY-ACCEPT`',
          }
          for old, new in substitutions.items():
              if old in text:
                  text = text.replace(old, new)
          p.write_text(text)

          # Maintenance policy: remove AWS witness as recurring M8 authority.
          p = root / 'docs/development-roadmap/12-launch-and-operations/05-maintenance-and-upgrade-policy.md'
          text = p.read_text()
          substitutions = {
              '**Status:** Planned M8-M9 operating control; current foundation CI/locks exist, but no production release, advisory automation, canary, backup, AWS witness, legal refresh or maintenance evidence exists': '**Status:** Planned M8-M9 operating control; current foundation CI/locks exist, but no production release, advisory automation, canary, encrypted R2 backup/restore, legal refresh or maintenance evidence exists',
              'INFRA-04/05 own restore/AWS witness/DR.': 'INFRA-04/05 own encrypted R2 restore/account-recovery/DR.',
              '| AWS S3 SDK/IAM/bucket/Object-Lock/conditional-write/account | full non-emulator `T7-AWS-WITNESS-ACCEPT`, repo-2 backup/WAL/restore, package/account-lockout and head ambiguity matrix | no fallback authority; unavailable=`30`, integrity=`40`, remain off |': '| Cloudflare R2 API/credential/bucket/encryption/account | full real `T7-R2-RECOVERY-ACCEPT`, application-encrypted backup/WAL/restore, off-host recovery-package and account-lockout/ambiguity matrix | no plaintext or unverified fallback; unavailable=`30`, integrity=`40`, remain off |',
          }
          for old, new in substitutions.items():
              if old in text:
                  text = text.replace(old, new)
          p.write_text(text)

          # Release process private ingress reference.
          replace(
              'docs/development-roadmap/11-infrastructure/02-ci-cd-and-release-process.md',
              'Operator deployment uses the VPS console/private Tailscale network to pull and verify exact digests, avoiding a permanent CI-to-VPS key.',
              'Operator deployment uses the VPS console or Cloudflare Access-protected private operator path to pull and verify exact digests, avoiding a permanent CI-to-VPS key or public SSH requirement.',
          )

          # Privacy/backup semantics: one encrypted R2 repository, app-owned retention/deletion evidence.
          p = root / 'docs/development-roadmap/08-security-and-compliance/06-data-privacy-and-retention.md'
          text = p.read_text()
          old = 'Backups are immutable but bounded: deletion is recorded in live truth and applied immediately after restore before workers/read access, while lifecycle/prune guarantees the exact 14-daily/4-weekly set and 35-day absolute recoverability ceiling. Object Lock `retain-until`, WAL dependency retention, version pruning, and both repositories use that same ceiling with no hold exception. A deletion tombstone/witness may outlive the chain only if its signed schema/content scan proves it contains no ciphertext, address, recipient hash, source locator, body, token, session handle/digest, or other reconstructible PII. Every restore runs the full authoritative tombstone replay, forces controls false, expires flows/revokes sessions, and validates no purged secret/payload becomes operationally accessible before API/workers/public ingress.'
          new = 'Backups are immutable-by-application-contract but bounded: deletion is recorded in live truth and applied immediately after restore before workers/read access, while lifecycle/prune enforces the registered retention ceiling over the single application-encrypted R2 repository and its WAL dependencies. Signed retention/deletion/tombstone evidence is application-owned and may outlive a backup chain only when its schema/content scan proves it contains no ciphertext, address, recipient hash, source locator, body, token, session handle/digest, or other reconstructible PII. Provider Object Lock or a second repository is not a pre-revenue prerequisite. Every restore runs the full authoritative tombstone replay, forces controls false, expires flows/revokes sessions, and validates no purged secret/payload becomes operationally accessible before API/workers/public ingress.'
          if old in text:
              text = text.replace(old, new)
          p.write_text(text)

          # Closed testing command catalog: retain stable command-count shape but replace AWS/GCS authority with R2.
          p = root / 'docs/development-roadmap/10-testing/01-testing-strategy.md'
          text = p.read_text()
          replacements = {
              '| release/M8 | clean restore host distinct from writers plus immutable candidate image; separate real-AWS acceptance target | no Gmail/provider during restore; the dedicated AWS S3 acceptance profile alone may access its disposable bucket | release/SBOM/provenance, AWS witness acceptance, restore, runbook, browser and capacity bundle | no promotion |': '| release/M8 | clean small-VPS restore target distinct from writers plus immutable candidate image and real R2 recovery target | no Gmail/calendar/model/discovery writes during restore; the dedicated R2 recovery profile alone may access its recovery bucket | release/SBOM/provenance, encrypted R2 acceptance, clean restore, runbook, browser and 2-vCPU/4-GB capacity bundle | no promotion |',
              'sole-AWS-S3-authority/head/provider-survival/M8-acceptance equality': 'sole-pre-revenue-R2-authority/encryption/recovery/M8-acceptance equality',
              '| `T7-BACKUP-BOTH` | `scripts/task7/handlers/backup-both` | operator / scheduled backup | `BACKUP_REPOSITORIES`; `T7-BACKUP-BOTH`, `BACKUP_REPOSITORIES` | per-repository pgBackRest check/backup/info/WAL coverage plus immutable GCS and accepted AWS S3 Object-Lock receipts |': '| `T7-BACKUP-R2` | `scripts/task7/handlers/backup-r2` | operator / scheduled backup | `BACKUP_R2`; `T7-BACKUP-R2`, `BACKUP_R2` | PostgreSQL backup/WAL coverage, application encryption before upload, signed manifest and Cloudflare R2 read-back/integrity evidence |',
              '| `T7-AWS-WITNESS-ACCEPT` | `scripts/task7/handlers/aws-witness-accept` | operator / M8 controlled-provider destructive acceptance | `AWS_S3_WITNESS_ACCEPT_EU_CENTRAL_1`; destructive form, `T7-AWS-WITNESS-ACCEPT`, `AWS_S3_WITNESS_ACCEPT_EU_CENTRAL_1` | real disposable `eu-central-1` general-purpose bucket identity; versioning/Object Lock/bucket-policy/IAM hashes; concurrent genesis/update CAS with `200|409|412|timeout` reconciliation; exact version/ETag/checksum/read-back; retention/delete/bypass denial; pgBackRest repo-2 backup/WAL/restore; independent package/account-lockout drill; signed evidence hashes |': '| `T7-R2-RECOVERY-ACCEPT` | `scripts/task7/handlers/r2-recovery-accept` | operator / M8 controlled-provider recovery acceptance | `R2_RECOVERY_ACCEPT`; destructive form, `T7-R2-RECOVERY-ACCEPT`, `R2_RECOVERY_ACCEPT` | real Cloudflare R2 bucket identity; least-privilege credential policy; client-side encryption; signed manifest/hash/read-back; backup/WAL restore from clean target with VPS unavailable; independent off-host recovery package/account-lockout drill; signed cost/egress/evidence hashes |',
              '| `T7-TOMBSTONE-PURGE` | `scripts/task7/handlers/tombstone-purge` | retention owner / manual destructive | `RETENTION_PRODUCTION`; destructive form, `T7-TOMBSTONE-PURGE`, `RETENTION_PRODUCTION` | PREPARED receipts, irreversible DB authorization/fences, GCS marker mirror/receipt, AWS S3 certificate/read receipt/sole head conditional-write receipt, applied transaction/watermark/ack |': '| `T7-TOMBSTONE-PURGE` | `scripts/task7/handlers/tombstone-purge` | retention owner / manual destructive | `RETENTION_PRODUCTION`; destructive form, `T7-TOMBSTONE-PURGE`, `RETENTION_PRODUCTION` | PREPARED receipts, irreversible DB authorization/fences, signed application retention/deletion ledger, R2 prune/read-back evidence where applicable, applied transaction/watermark/ack |',
              'the reachable `T7-AWS-WITNESS-ACCEPT` row': 'the reachable `T7-R2-RECOVERY-ACCEPT` row',
              '- [ ] `T7-AWS-WITNESS-ACCEPT` is a required M8 row: missing AWS authorization/credits/provider access is unavailable exit `30`, no emulator can pass, and any failed semantic blocks M8 pending a signed architecture amendment to an otherwise unselected provider with documented and live-tested CAS/Object Lock.': '- [ ] `T7-R2-RECOVERY-ACCEPT` is a required M8 row: missing R2 authorization/provider access or off-host recovery material is unavailable exit `30`; no emulator alone can pass; application encryption, real read-back, clean-host restore and account-recovery failures block M8. Multi-cloud/Object-Lock/KMS controls remain post-revenue upgrade candidates, not this row\'s prerequisites.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"TEST-01 expected text missing: {old[:80]!r}")
              text = text.replace(old, new)
          # Stable global rename where old command/profile names remain inside this document.
          text = text.replace('T7-AWS-WITNESS-ACCEPT', 'T7-R2-RECOVERY-ACCEPT')
          text = text.replace('AWS_S3_WITNESS_ACCEPT_EU_CENTRAL_1', 'R2_RECOVERY_ACCEPT')
          text = text.replace('T7-BACKUP-BOTH', 'T7-BACKUP-R2')
          text = text.replace('BACKUP_REPOSITORIES', 'BACKUP_R2')
          text = text.replace('backup-both', 'backup-r2')
          p.write_text(text)

          # Chaos suite language.
          replace(
              'docs/development-roadmap/10-testing/06-load-security-and-chaos-tests.md',
              'Preserve the existing public unsubscribe abuse, secret/OAuth/SSRF, cap-race, AWS witness and DR cases.',
              'Preserve the existing public unsubscribe abuse, secret/OAuth/SSRF, cap-race, encrypted R2 recovery/account-lockout and DR cases.',
          )

          # Global rename of stable pre-revenue command references in active roadmap sources.
          for p in Path('docs/development-roadmap').glob('[0-9][0-9]-*/*.md'):
              text = p.read_text()
              updated = (
                  text.replace('T7-AWS-WITNESS-ACCEPT', 'T7-R2-RECOVERY-ACCEPT')
                      .replace('AWS_S3_WITNESS_ACCEPT_EU_CENTRAL_1', 'R2_RECOVERY_ACCEPT')
                      .replace('T7-BACKUP-BOTH', 'T7-BACKUP-R2')
                      .replace('BACKUP_REPOSITORIES', 'BACKUP_R2')
              )
              if updated != text:
                  p.write_text(updated)

          # Remove temporary helper workflows; this finalizer removes itself too.
          for helper in Path('.github/workflows').glob('*cost-roadmap*.yml'):
              if helper.name != 'ci.yml':
                  helper.unlink()
          for name in ('finalize-cost-tests.yml', 'format-cost-roadmap-tests.yml'):
              helper = Path('.github/workflows') / name
              if helper.exists():
                  helper.unlink()
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Regenerate roadmap artifacts
        run: |
          python3 scripts/validate_roadmap.py --write
          python3 scripts/validate_roadmap.py --check
      - name: Format and run focused validator tests
        run: |
          uv run ruff format tests/unit/test_roadmap_validator.py ../scripts/validate_roadmap.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest tests/unit/test_roadmap_validator.py -q
        working-directory: backend
      - name: Reject surviving active contradictions
        run: |
          ! grep -RInE 'terminal 1,000|beginning with Google Maps|Discovery uses Google Maps|T7-AWS-WITNESS-ACCEPT|AWS S3 is the sole|encrypted GCS plus selected AWS|required M8 row: missing AWS|sole-AWS-S3-authority|clean restore host.*real-AWS|KMS plus Secret Manager is the selected production adapter|private Tailscale network' docs/development-roadmap
      - name: Commit, rebase latest branch, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close cost-first roadmap consistency gaps"
          git fetch origin cost-optimized-roadmap
          git rebase origin/cost-optimized-roadmap
          git push origin HEAD:cost-optimized-roadmap

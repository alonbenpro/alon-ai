name: Finalize Cost-First Roadmap Assertions

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/finalize-cost-assertions.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Update stale legacy assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/unit/test_roadmap_validator.py')
          s = p.read_text()
          s = s.replace('def test_active_roadmap_uses_only_staged_thousand_lead_contract() -> None:', 'def test_active_roadmap_uses_only_cost_first_launch_contract() -> None:', 1)
          s = s.replace('    assert "100/200/300/400" in active_text', '    assert "100/200/300/400" not in active_text', 1)
          s = s.replace('    assert "100/300/600/1,000" in active_text', '    assert "100/300/600/1,000" not in active_text', 1)
          p.write_text(s)
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          version: '0.11.26'
      - name: Sync backend
        working-directory: backend
        run: uv sync --locked --all-extras --dev
      - name: Format test file
        working-directory: backend
        run: uv run ruff format tests/unit/test_roadmap_validator.py
      - name: Verify roadmap artifacts
        run: python3 scripts/validate_roadmap.py --check
      - name: Run focused validator tests
        working-directory: backend
        run: uv run pytest tests/unit/test_roadmap_validator.py -q
      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/finalize-cost-assertions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: finalize cost-first roadmap assertions'
          git push origin HEAD:cost-optimized-roadmap

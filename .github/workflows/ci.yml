name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan tracked files for credential material
        run: python3 scripts/check_secrets.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: alon_ai
          POSTGRES_USER: alon_ai
          POSTGRES_PASSWORD: alon_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alon_ai -d alon_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALON_AI_DATABASE_URL: postgresql+psycopg://alon_ai:alon_ai@localhost:5432/alon_ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate executable roadmap
        run: python3 scripts/validate_roadmap.py --check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          version: "0.11.26"
      - run: uv sync --locked --all-extras --dev
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pyright
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest tests -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          version: "0.11.26"
      - run: uv sync --locked --all-extras --dev
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config
      - name: Build container images
        run: docker compose --env-file .env.example -f infra/compose.yaml build api worker frontend
      - name: Migrate and smoke-test the running stack
        env:
          ALON_AI_ENVIRONMENT: production
        run: |
          set -Eeuo pipefail

          compose=(docker compose --env-file .env.example -f infra/compose.yaml)

          cleanup() {
            exit_code=$?
            trap - EXIT
            if (( exit_code != 0 )); then
              "${compose[@]}" ps -a || true
              "${compose[@]}" logs --no-color --timestamps postgres api worker frontend || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          "${compose[@]}" run --rm api alembic upgrade head
          "${compose[@]}" up --detach --no-build --wait --wait-timeout 180

          curl --fail --silent --show-error http://127.0.0.1:8000/health/live |
            python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok", "service": "api"}'
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready |
            python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ready", "database": "up"}'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/

          for service in postgres api worker frontend; do
            container_id="$("${compose[@]}" ps --quiet "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.State.Status}}' "$container_id")" = "running"
          done

          for service in postgres api frontend; do
            container_id="$("${compose[@]}" ps --quiet "$service")"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          done

          test "$("${compose[@]}" exec --no-TTY api id --user)" != "0"
          test "$("${compose[@]}" exec --no-TTY worker id --user)" != "0"
          "${compose[@]}" exec --no-TTY api python -c 'from alon_ai.config import get_settings; assert get_settings().outreach_enabled is False'
          "${compose[@]}" exec --no-TTY worker python -c 'from alon_ai.config import get_settings; assert get_settings().outreach_enabled is False'
          "${compose[@]}" logs --no-color worker | grep -F 'worker_ready' >/dev/null

name: Format Cost-First Roadmap Tests

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/cost-roadmap-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Format validator test
        run: uv run ruff format tests/unit/test_roadmap_validator.py
        working-directory: backend
      - name: Verify roadmap remains current
        run: python3 scripts/validate_roadmap.py --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/unit/test_roadmap_validator.py
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format cost-first roadmap validator tests"
            git push origin HEAD:cost-optimized-roadmap
          fi

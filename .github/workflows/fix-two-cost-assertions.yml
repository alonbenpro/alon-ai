name: Correct Two Cost-First Assertions

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/fix-two-cost-assertions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - name: Flip stale legacy assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("backend/tests/unit/test_roadmap_validator.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "def test_active_roadmap_uses_only_staged_thousand_lead_contract() -> None:",
              "def test_active_roadmap_uses_only_cost_first_launch_contract() -> None:",
              1,
          )
          text = text.replace(
              '    assert "100/200/300/400" in active_text',
              '    assert "100/200/300/400" not in active_text',
              1,
          )
          text = text.replace(
              '    assert "100/300/600/1,000" in active_text',
              '    assert "100/300/600/1,000" not in active_text',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Verify
        run: |
          python3 scripts/validate_roadmap.py --check
          cd backend
          uv sync --locked --all-extras --dev
          uv run ruff format --check tests/unit/test_roadmap_validator.py
          uv run pytest tests/unit/test_roadmap_validator.py -q
      - name: Commit and self-delete
        run: |
          rm -f .github/workflows/fix-two-cost-assertions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: remove legacy cohort expectations"
          git push origin HEAD:cost-optimized-roadmap

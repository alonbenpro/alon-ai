name: Format Cost Roadmap Validator Tests

on:
  push:
    branches: [cost-optimized-roadmap]
    paths:
      - .github/workflows/format-cost-roadmap-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cost-optimized-roadmap
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          version: "0.11.26"
      - name: Sync backend dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: backend
      - name: Format validator tests
        run: uv run ruff format tests/unit/test_roadmap_validator.py
        working-directory: backend
      - name: Verify roadmap and focused tests
        run: |
          python3 scripts/validate_roadmap.py --check
          cd backend
          uv run ruff format --check .
          uv run pytest tests/unit/test_roadmap_validator.py -q
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/format-cost-roadmap-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: format cost-first roadmap validator" || exit 0
          git push origin HEAD:cost-optimized-roadmap

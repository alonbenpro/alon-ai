[project]
name = "alon-ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alonbenpro", email = "298319230+alonbenpro@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "dbos>=2.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-ai[dbos]>=2.35.3",
    "pydantic-evals>=2.35.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "alon_ai"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a real PostgreSQL database",
]

[tool.ruff]
target-version = "py313"

[tool.pyright]
include = ["src", "tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
